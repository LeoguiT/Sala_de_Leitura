databaseChangeLog:
  - changeSet:
      id: 001-01-create-categoria-livro
      author: aluno-spring-2026
      comment: Cria a tabela que classifica os livros.
      changes:
        - createTable:
            tableName: categoria_livro
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_categoria_livro
                    nullable: false
              - column:
                  name: nome
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: categoria_livro

  - changeSet:
      id: 001-02-check-status-categoria-livro
      author: aluno-spring-2026
      comment: Restringe o status aos valores definidos no enum Java.
      changes:
        - sql:
            sql: >
              ALTER TABLE categoria_livro
              ADD CONSTRAINT ck_categoria_livro_status
              CHECK (status IN ('ATIVO', 'INATIVO'))
      rollback:
        - sql:
            sql: >
              ALTER TABLE categoria_livro
              DROP CONSTRAINT ck_categoria_livro_status
